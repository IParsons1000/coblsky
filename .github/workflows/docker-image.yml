name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: make docker-build
    - name: Launch the Docker image
      run: make docker-run
    - name: Kill the Docker image
      run: make docker-clean
